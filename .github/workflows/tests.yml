name: tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Contract lint (Studio rules)
        run: python3 scripts/deploy/check_contract.py
      - name: Unit, integration, state machine, adversarial, security, fuzz, JS conformance
        run: python3 -m unittest discover -s tests -t . -v
      - name: Deeper fuzz sweep
        run: FUZZ_RUNS=300 FUZZ_STEPS=80 python3 -m unittest tests.fuzz.test_fuzz_state_machine
      - name: Mutation check of the test suite
        run: python3 tests/mutation_test.py
      - name: Demo outputs are reproducible
        run: python3 scripts/demo/run_demo.py --check
      - name: Verify the shipped example certificates with both verifiers
        run: |
          cd examples/demo-agreement
          for n in settled refunded-after-jury; do
            python3 ../../scripts/verification/verify_certificate.py certificate-$n.json --bundle bundle-$n.json --onchain-hash "$(cat onchain-hash-$n.txt)"
            node ../../frontend/assets/verify.js certificate-$n.json --bundle bundle-$n.json --onchain-hash "$(cat onchain-hash-$n.txt)"
          done
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 -m unittest tests.frontend.test_frontend_smoke -v
